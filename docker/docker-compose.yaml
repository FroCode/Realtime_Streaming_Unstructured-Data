version: "3.9"

services:
  spark-master:
    image: bitnami/spark:latest
    container_name: spark-master
    hostname: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=false
      - SPARK_RPC_ENCRYPTION_ENABLED=false
      - SPARK_LOCAL_DIRS=/tmp
    ports:
      - "8585:8080" # Spark Web UI
      - "7077:7077" # Spark Master Port
    networks:
      - spark-network
    volumes:
      - ./input:/opt/bitnami/spark/input:rw
      - ./jobs:/opt/bitnami/spark/jobs:rw
    command: /opt/bitnami/spark/bin/spark-class org.apache.spark.deploy.master.Master

  spark-worker-1:
    image: bitnami/spark:latest
    container_name: spark-worker-1
    hostname: spark-worker-1
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=1G
    depends_on:
      - spark-master
    networks:
      - spark-network

  spark-worker-2:
    image: bitnami/spark:latest
    container_name: spark-worker-2
    hostname: spark-worker-2
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=1G
    depends_on:
      - spark-master
    networks:
      - spark-network

  # Uncomment if you need more workers
  # spark-worker-3:
  #   image: bitnami/spark:latest
  #   container_name: spark-worker-3
  #   hostname: spark-worker-3
  #   environment:
  #     - SPARK_MODE=worker
  #     - SPARK_MASTER_URL=spark://spark-master:7077
  #     - SPARK_WORKER_CORES=2
  #     - SPARK_WORKER_MEMORY=1G
  #   depends_on:
  #     - spark-master
  #   networks:
  #     - spark-network

  spark-job:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark-job
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2
    networks:
      - spark-network
    command: spark-submit --master spark://spark-master:7077 /opt/bitnami/spark/jobs/main.py

networks:
  spark-network:
    driver: bridge
