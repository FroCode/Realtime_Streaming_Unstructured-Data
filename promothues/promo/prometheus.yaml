global:
  scrape_interval: 5s  # Adjust as needed

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']

  - job_name: 'docker'
    static_configs:
      - targets: ['host.docker.internal:9323']  # Use this for Mac/Windows
      # - targets: ['localhost:9323']  # Use this for Linux
